[tox]
envlist = py38, py39, py310, py311

[testenv]
deps =
    -rrequirements-dev.txt
commands =
    pytest

[pytest]
addopts = -v --tb=short
testpaths = tests

[flake8]
max-line-length = 88
extend-ignore = E203, E266, E501, W503
exclude = .git,__pycache__,docs,old,build,dist

[coverage:run]
branch = True
source = src/pymcprotocol_wrapper

[coverage:report]
show_missing = True
skip_covered = True
