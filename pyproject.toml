[tool.poetry]
name = "pymcprotocol-wrapper"
version = "0.1.1"
description = "A wrapper around the pymcprotocol library for easier testing and development."
authors = ["Sotaro Hikosaka <hikosakam@crew.ne.jp>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
pymcprotocol = "^0.3.0"

[tool.poetry.dev-dependencies]
pytest = "^6.0"
tox = "^3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mock==4.0.3",
    "pymcprotocol==0.3.0",
    "pytest==7.0.0",
]
