name: Regression - pymcprotocol compatibility

on:
  push: {}
  pull_request: {}
  schedule:
    - cron: '0 3 * * 6' # Saturday 03:00 UTC == Saturday 12:00 JST

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.10, 3.11]
        pmc-version: ["0.3.0", "latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install target pymcprotocol (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.pmc-version }}" = "latest" ]; then
            pip install -U pymcprotocol
          else
            pip install "pymcprotocol==${{ matrix.pmc-version }}"
          fi

      - name: Install target pymcprotocol (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ('${{ matrix.pmc-version }}' -eq 'latest') {
            pip install -U pymcprotocol
          } else {
            pip install "pymcprotocol==${{ matrix.pmc-version }}"
          }

      - name: Install package (editable, no deps) (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . --no-deps

      - name: Install package (editable, no deps) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . --no-deps

      - name: Run tests
        run: |
          pytest -q
