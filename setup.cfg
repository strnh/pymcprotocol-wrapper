[metadata]
name = pymcprotocol-wrapper
version = 0.1.1
description = A wrapper for the pymcprotocol library to facilitate testing without a physical PLC connection.
author = Your Name
author_email = your.email@example.com
url = https://github.com/yourusername/pymcprotocol-wrapper
license = MIT

[options]
packages = find:
install_requires =
    pymcprotocol

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest
    tox
    flake8
    black
    mypy

[options.entry_points]
console_scripts =
    pymcprotocol-wrapper = pymcprotocol_wrapper.__main__:main
